<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="Karun H G terminal profile card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FF9C"/>
      <stop offset="0.5" stop-color="#2389E8"/>
      <stop offset="1" stop-color="#00FF9C"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00FF9C" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="898" height="308" rx="12"/></clipPath>
    <clipPath id="l1"><rect x="30" y="64" width="0" height="30"><animate attributeName="width" from="0" to="330" dur="1s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="30" y="94" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.4s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="30" y="128" width="0" height="30"><animate attributeName="width" from="0" to="360" dur="1s" begin="3.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="30" y="158" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.4s" begin="4.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="30" y="192" width="0" height="30"><animate attributeName="width" from="0" to="330" dur="1s" begin="5.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="30" y="222" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.2s" begin="6.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="308" rx="12" fill="#080D12"/>
  <g clip-path="url(#card)">
    <rect width="900" height="310" fill="url(#grid)"/>
    <!-- title bar -->
    <rect x="0" y="0" width="900" height="40" fill="#0D1A17"/>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#00FF9C" stroke-opacity="0.25"/>
    <circle cx="26" cy="20" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="20" r="6" fill="#FFBD2E"/>
    <circle cx="70" cy="20" r="6" fill="#27C93F"/>
    <text x="450" y="25" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#7FA89A">karun@karun-lab: ~/about</text>
    <circle cx="790" cy="20" r="4" fill="#00FF9C"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="802" y="25" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#00FF9C" letter-spacing="1.5">ONLINE</text>

    <!-- terminal lines -->
    <g font-family="'Courier New', Consolas, monospace" font-size="16">
      <g clip-path="url(#l1)"><text x="30" y="84"><tspan fill="#00FF9C">root@karun-lab</tspan><tspan fill="#8B9BA7">:~$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text></g>
      <g clip-path="url(#l2)"><text x="30" y="113" fill="#E6EDF3" font-weight="bold">Karun H G <tspan fill="#00FF9C">|</tspan> MCA Student <tspan fill="#00FF9C">|</tspan> Cybersecurity Learner <tspan fill="#00FF9C">|</tspan> Developer</text></g>

      <g clip-path="url(#l3)"><text x="30" y="148"><tspan fill="#00FF9C">root@karun-lab</tspan><tspan fill="#8B9BA7">:~$ </tspan><tspan fill="#E6EDF3">cat focus.txt</tspan></text></g>
      <g clip-path="url(#l4)"><text x="30" y="177" fill="#9FB3C8">SOC Operations  ·  Network Forensics  ·  DNS Recon  ·  AI Security</text></g>

      <g clip-path="url(#l5)"><text x="30" y="212"><tspan fill="#00FF9C">root@karun-lab</tspan><tspan fill="#8B9BA7">:~$ </tspan><tspan fill="#E6EDF3">./status.sh</tspan></text></g>
      <g clip-path="url(#l6)"><text x="30" y="241" font-weight="bold"><tspan fill="#FF5252">[ RED TEAM ]</tspan><tspan fill="#8B9BA7">  x  </tspan><tspan fill="#2389E8">[ BLUE TEAM ]</tspan><tspan fill="#8B9BA7">  x  </tspan><tspan fill="#00FF9C">[ AI SECURITY ]</tspan></text></g>

      <!-- final prompt + blinking cursor -->
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="8.2s" fill="freeze"/>
        <text x="30" y="283"><tspan fill="#00FF9C">root@karun-lab</tspan><tspan fill="#8B9BA7">:~$ </tspan></text>
        <rect x="236" y="269" width="10" height="18" fill="#00FF9C"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- moving scanline -->
    <rect x="0" y="40" width="900" height="3" fill="#00FF9C" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 270; 0 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- glowing border -->
  <rect x="1" y="1" width="898" height="308" rx="12" fill="none" stroke="url(#border)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
