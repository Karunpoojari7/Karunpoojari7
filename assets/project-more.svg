<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190" width="440" height="190" role="img" aria-label="More on GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00FF9C" stroke-opacity="0.05"/></pattern></defs>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.85s" fill="freeze"/>
<rect x="1" y="1" width="438" height="188" rx="10" fill="#0A1218"/><rect x="1" y="1" width="438" height="188" rx="10" fill="url(#p)"/>
<rect x="1" y="1" width="438" height="188" rx="10" fill="none" stroke="#00FF9C" stroke-opacity="0.45" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite"/></rect>
<g stroke="#00FF9C" stroke-width="2" stroke-linecap="round"><line x1="220" y1="48" x2="220" y2="72"/><line x1="208" y1="60" x2="232" y2="60"/></g>
<circle cx="220" cy="60" r="20" fill="none" stroke="#00FF9C" stroke-opacity="0.5"><animate attributeName="r" values="20;26;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="220" y="108" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">More on GitHub</text>
<text x="220" y="132" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A9B8C4">Experiments, notes and projects in progress.</text>
<text x="220" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A9B8C4">New work is added as I ship it.</text>
<text x="220" y="177" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#00FF9C" font-weight="bold" letter-spacing="2">VIEW ALL REPOSITORIES  &#8594;</text>
</g></svg>